[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sugar"
version = "0.1.0"
description: "Sugar — Your personal AI operating layer. (Proprietary)"
readme = "README.md"
requires-python = ">=3.11"
license = "Proprietary"
authors = [
    {name = "kuro"},
]

dependencies = [
    "ollama>=0.4.0",
    "requests>=2.31.0",
    "python-telegram-bot>=21.0",
    "duckduckgo-search>=7.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5.0",
    "mypy>=1.10",
    "bandit>=1.7",
    "pre-commit>=3.5",
]

[project.scripts]
sugar = "sugar.interfaces.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "S"]
ignore = ["S101"]  # Allow assert in tests

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.setuptools]
packages = ["sugar"]
